name: Deployment

on:
  release:
    types:
      - created

jobs:
  dist_linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            image: 84codes/crystal:1.14.1-alpine
            libs_cmd: apk add --update --upgrade --no-cache --force-overwrite libxml2-dev yaml-dev yaml-static
            build_flags: --production --release --static --no-debug
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: 84codes/crystal:1.14.1-ubuntu-24.04
            libs_cmd: apt-get update && apt-get install -y --no-install-recommends libxml2-dev libyaml-dev
            build_flags: --production --release --no-debug
    container:
      image: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v3
    - name: Update Libs
      run: ${{ matrix.libs_cmd }}
    - name: Build
      run: shards build ${{ matrix.build_flags }}
      env:
        WIZARD_INSTALLATION_METHOD: download-binary
    - name: Upload
      uses: actions/upload-release-asset@v1.0.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./bin/tmux-fingers
        asset_name: tmux-fingers-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}
        asset_content_type: binary/octet-stream
  dist_macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: "1.14.1"
    - name: Install deps
      run: brew install libyaml libxml2 pkg-config
    - name: Build
      run: shards build --production --release --no-debug
      env:
        WIZARD_INSTALLATION_METHOD: download-binary
        PKG_CONFIG_PATH: /opt/homebrew/opt/libyaml/lib/pkgconfig:/opt/homebrew/opt/libxml2/lib/pkgconfig
    - name: Upload
      uses: actions/upload-release-asset@v1.0.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./bin/tmux-fingers
        asset_name: tmux-fingers-${{ github.event.release.tag_name }}-darwin-arm64
        asset_content_type: binary/octet-stream
